<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#faf8f4" />
  <title>Page not found | WB Studio</title>
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400&amp;family=Cormorant+Garamond:wght@400;600&amp;family=IBM+Plex+Sans+Arabic:wght@400&amp;family=Inter:wght@400&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/site.css" />
  <style>
    body { min-height: 100svh; display: grid; place-items: center; padding: clamp(2rem, 6vw, 5rem) var(--pad); }
    main { width: min(100%, 38rem); }
    .studio { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; }
    .error-code { font: 400 clamp(5rem, 17vw, 9rem)/1 var(--font-display); margin-block: 2rem 1.25rem; }
    .recovery { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .35rem 1.5rem; padding-block: .8rem; border-block-start: 1px solid var(--line); }
    .recovery h2 { font-size: 1.28rem; }
    .recovery nav { display: flex; flex-wrap: wrap; gap: 0 1rem; }
    .recovery nav a { display: inline-flex; align-items: center; min-height: 2.75rem; font-size: .94rem; text-underline-offset: .22em; }
    .recovery nav a:hover { color: var(--ink-soft); }
    .recovery[lang="ar"] { font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
    .recovery[lang="ar"] h2 { font-family: "Amiri", serif; letter-spacing: 0; }
  </style>
</head>
<body>
  <main>
    <a class="studio" href="/"><img src="/assets/icons/brand-logo.png" width="40" height="40" alt="" /><span class="wordmark">WB Studio</span></a>
    <h1 class="error-code">404</h1>
    <section class="recovery">
      <h2>Page not found</h2>
      <nav aria-label="English"><a href="/">Home</a><a href="/en/work/">Projects</a><a href="/en/contact/">Contact</a></nav>
    </section>
    <section class="recovery" lang="ar" dir="rtl">
      <h2>الصفحة غير موجودة</h2>
      <nav aria-label="العربية"><a href="/ar/">الرئيسية</a><a href="/work/">الأعمال</a><a href="/contact/">تواصل</a></nav>
    </section>
    <section class="recovery" lang="de">
      <h2>Seite nicht gefunden</h2>
      <nav aria-label="Deutsch"><a href="/de/">Startseite</a><a href="/de/projekte/">Projekte</a><a href="/de/kontakt/">Kontakt</a></nav>
    </section>
  </main>
</body>
</html>
